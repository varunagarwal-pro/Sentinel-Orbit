name: "🧹 Fleet: Storage & Run Pruner"

on:
  workflow_run:
    workflows: ["🔄 Fleet: Upstream Sync Engine"]
    types:
      - completed
  schedule:
    # Daily fallback at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without deleting'
        type: boolean
        default: false
      keep_runs:
        description: 'Number of latest completed runs to keep per workflow'
        type: number
        default: 1

jobs:
  prune-storage:
    name: Prune Account Caches & Runs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Sentinel-Orbit Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Sentinel-Orbit Pruner
        env:
          PAT_JANITOR: ${{ secrets.PAT_ORBIT || secrets.PAT_JANITOR }}
          GH_TOKEN: ${{ secrets.PAT_ORBIT || secrets.PAT_JANITOR }}
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
          KEEP_RUNS: ${{ github.event.inputs.keep_runs || 1 }}
        run: |
          FLAGS="--live"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS=""
          fi
          case "$KEEP_RUNS" in ""|*[!0-9]*) echo "keep_runs must be a number"; exit 1;; esac
          python scripts/prune_account_storage.py $FLAGS --keep "$KEEP_RUNS"
