# CodeRabbit Master Review Configuration — Sentinel-Orbit
# Reference: Docs/CodeRabbit.md
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  changed_files_summary: true
  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false
  review_status: true
  commit_status: true
  enable_prompt_for_ai_agents: true

  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
      - "dev"

  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  tools:
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true

  path_filters:
    - "!**/temp/**"
    - "!**/*.log"

  path_instructions:
    - path: ".github/workflows/**"
      instructions: |
        Ensure all GitHub Actions workflows enforce least-privilege permissions, rate-limit backoffs,
        and fail-safe zero-data-loss pruning logic.

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: "auto"

chat:
  auto_reply: true
